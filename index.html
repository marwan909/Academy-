<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Technova Academy | STEM Management</title>
  <!-- الخطوط والأيقونات -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- المكتبات: Chart.js, jsPDF, html2canvas, XLSX, QRCode, Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ========== نفس تصميمك الأصلي الجميل ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    :root {
      --bg-primary: #f8fafc; --bg-secondary: #ffffff; --text-primary: #0f172a;
      --sidebar-bg: #ffffff; --border-light: #e2e8f0; --card-bg: #ffffff;
      --primary: #3b82f6; --primary-glow: #3b82f640;
    }
    .dark-mode {
      --bg-primary: #0f172a; --bg-secondary: #1e293b; --text-primary: #f8fafc;
      --sidebar-bg: #0f172a; --border-light: #334155; --card-bg: #1e293b;
    }
    body {
      background: var(--bg-primary); color: var(--text-primary); display: flex; min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .sidebar {
      width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border-light);
      padding: 1.5rem 1rem; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; padding: 0.5rem; }
      .nav-menu { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .nav-item { padding: 8px 12px; }
    }
    .main-content { flex: 1; padding: 1.5rem; overflow-y: auto; }
    .glass-card {
      background: var(--card-bg); border-radius: 24px; padding: 1.5rem;
      border: 1px solid var(--border-light); margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; }
    .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); padding: 8px 16px; border-radius: 40px; cursor: pointer; }
    input, select, textarea {
      background: var(--bg-primary); border: 1px solid var(--border-light); padding: 12px;
      border-radius: 16px; color: var(--text-primary); width: 100%; margin-bottom: 10px;
    }
    .badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 40px; font-size: 0.8rem; display: inline-block; }
    .login-container {
      max-width: 400px; margin: 10vh auto; padding: 2rem; background: var(--card-bg);
      border-radius: 32px; border: 1px solid var(--border-light);
    }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000b0;
      display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px);
    }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border-light); }
    .btn-sm { padding: 4px 8px; font-size: 0.8rem; margin: 0 4px; }
  </style>
</head>
<body class="light-mode">

<!-- شاشة تسجيل الدخول -->
<div id="authScreen" class="login-container">
  <div style="text-align: center; margin-bottom: 2rem;">
    <i class="fas fa-cube" style="font-size: 3rem; color: var(--primary);"></i>
    <h2 style="margin-top: 1rem;">Technova Academy</h2>
    <p>نظام إدارة STEM المتكامل</p>
  </div>
  <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" value="admin@technova.com">
  <input type="password" id="loginPassword" placeholder="كلمة المرور" value="123456">
  <button class="btn-primary" style="width: 100%; margin-top: 1rem;" onclick="handleLogin()">تسجيل الدخول</button>
  <p style="margin-top: 1rem; font-size: 0.8rem; text-align: center;">
    <i class="fas fa-qrcode"></i> أو <a href="#" onclick="showParentQRLogin(); return false;">دخول ولي الأمر بـ QR</a>
  </p>
</div>

<!-- الواجهة الرئيسية -->
<div id="mainAppInterface" style="display: none; width: 100%;">
  <div class="sidebar">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 2rem;">
      <i class="fas fa-cube" style="font-size: 2.5rem; color: var(--primary);"></i>
      <div><h2>Technova</h2><small>STEM Horizon</small></div>
    </div>
    <div class="nav-menu">
      <button class="nav-item active" data-view="dashboard"><i class="fas fa-th-large"></i> <span>لوحة التحكم</span></button>
      <button class="nav-item" data-view="students"><i class="fas fa-users"></i> <span>الطلاب</span></button>
      <button class="nav-item" data-view="levels"><i class="fas fa-layer-group"></i> <span>المستويات والمحتوى</span></button>
      <button class="nav-item" data-view="attendance"><i class="fas fa-calendar-check"></i> <span>الحضور</span></button>
      <button class="nav-item" data-view="reports"><i class="fas fa-chart-bar"></i> <span>التقارير</span></button>
      <button class="nav-item" data-view="coaches"><i class="fas fa-chalkboard-user"></i> <span>المدربين</span></button>
      <button class="nav-item" data-view="leaderboard"><i class="fas fa-trophy"></i> <span>المتصدرين</span></button>
    </div>
    <div style="margin-top: auto;">
      <button onclick="toggleDarkMode()" class="btn-outline" style="width:100%; margin-bottom:10px;"><i class="fas fa-moon"></i> تغيير المظهر</button>
      <button onclick="logout()" class="btn-outline" style="width:100%;"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</button>
    </div>
  </div>

  <div class="main-content">
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
      <h2 id="viewTitle">لوحة التحكم</h2>
      <div><span id="userRoleBadge" style="background: var(--primary); padding: 4px 16px; border-radius: 40px;">أدمن</span></div>
    </div>
    <div id="dynamicContent">جاري تحميل النظام...</div>
  </div>
</div>

<!-- Modal QR -->
<div id="qrModal" class="modal" style="display: none;">
  <div class="glass-card" style="max-width: 400px; text-align: center;">
    <h3>مسح QR للدخول</h3>
    <div style="background: white; padding: 1rem; border-radius: 16px;">
      <i class="fas fa-camera" style="font-size: 3rem; color: #000;"></i>
      <p style="color: #000;">في النسخة النهائية، هنا كاميرا لمسح الكود</p>
      <input placeholder="أو ادخل الكود يدويا" id="manualQRInput" style="margin-top: 10px; background: #fff; color: #000;">
      <button class="btn-primary" onclick="loginWithToken()">دخول</button>
    </div>
    <button onclick="document.getElementById('qrModal').style.display='none'" class="btn-outline" style="margin-top: 10px;">إغلاق</button>
  </div>
</div>

<script>
  // ========== إعدادات Supabase ==========
  const SUPABASE_URL = 'https://tdmpkewggmtrjgtaqpiv.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbXBrZXdnZ210cmpndGFxcGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NjE4NDUsImV4cCI6MjA5MTUzNzg0NX0.FYOC74kWTORjxSktZdAotnE50_9BkorwphAtkew-38Q';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let userProfile = null;
  let appState = { students: [], levels: [], coaches: [] };

  // ========== دوال المصادقة ==========
  async function handleLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await loadUserProfile(data.user);
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainAppInterface').style.display = 'flex';
      await fetchInitialData();
      renderView('dashboard');
    } catch (err) {
      alert('خطأ في الدخول: ' + err.message);
    }
  }

  async function loadUserProfile(user) {
    currentUser = user;
    const { data } = await supabase.from('profiles').select('*').eq('id', user.id).single();
    if (!data) {
      await supabase.from('profiles').insert({ id: user.id, full_name: user.email, role: 'admin' });
      userProfile = { role: 'admin' };
    } else {
      userProfile = data;
    }
    document.getElementById('userRoleBadge').innerText = userProfile.role === 'admin' ? 'مدير النظام' : userProfile.role;
  }

  async function logout() { await supabase.auth.signOut(); location.reload(); }

  // ========== جلب البيانات ==========
  async function fetchInitialData() {
    const [studentsRes, levelsRes, coachesRes] = await Promise.all([
      supabase.from('students').select('*'),
      supabase.from('levels').select('*'),
      supabase.from('profiles').select('*').eq('role', 'coach')
    ]);
    appState.students = studentsRes.data || [];
    appState.levels = levelsRes.data || [];
    appState.coaches = coachesRes.data || [];
  }

  // ========== عرض الصفحات ==========
  async function renderView(viewId) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[data-view="${viewId}"]`)?.classList.add('active');
    document.getElementById('viewTitle').innerText = document.querySelector(`[data-view="${viewId}"] span`)?.innerText || 'لوحة التحكم';
    await fetchInitialData();
    const container = document.getElementById('dynamicContent');
    switch(viewId) {
      case 'dashboard': container.innerHTML = renderDashboard(); break;
      case 'students': container.innerHTML = await renderStudentsView(); break;
      case 'levels': container.innerHTML = await renderLevelsView(); break;
      case 'leaderboard': container.innerHTML = renderLeaderboard(); break;
      default: container.innerHTML = `<div class="glass-card"><h3>قيد التطوير</h3></div>`;
    }
  }

  function renderDashboard() {
    return `
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div class="glass-card"><i class="fas fa-user-graduate fa-2x" style="color: var(--primary);"></i><h3>${appState.students.length}</h3><p>إجمالي الطلاب</p></div>
        <div class="glass-card"><i class="fas fa-layer-group fa-2x"></i><h3>${appState.levels.length}</h3><p>المستويات</p></div>
        <div class="glass-card"><i class="fas fa-chalkboard-user fa-2x"></i><h3>${appState.coaches.length}</h3><p>مدربين</p></div>
      </div>
    `;
  }

  async function renderStudentsView() {
    let rows = '';
    appState.students.forEach(s => {
      rows += `<tr>
        <td><img src="${s.image_url || 'https://i.pravatar.cc/40'}" style="width:40px;height:40px;border-radius:50%;"></td>
        <td>${s.name}</td>
        <td>${s.age || '-'}</td>
        <td><span class="badge">${appState.levels.find(l=>l.id==s.level_id)?.name || 'بدون مستوى'}</span></td>
        <td>
          <button class="btn-outline btn-sm" onclick="generateQRCode('${s.qr_token}', '${s.name}')"><i class="fas fa-qrcode"></i></button>
          <button class="btn-outline btn-sm" onclick="editStudentPrompt(${s.id})"><i class="fas fa-edit"></i></button>
        </td>
      </tr>`;
    });
    return `
      <div class="glass-card">
        <div style="display:flex; justify-content:space-between;">
          <h3>قائمة الطلاب</h3>
          <button class="btn-primary" onclick="showAddStudentForm()"><i class="fas fa-plus"></i> إضافة طالب</button>
        </div>
        <div class="table-wrapper"><table><thead><tr><th>صورة</th><th>الاسم</th><th>السن</th><th>المستوى</th><th>إجراءات</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>
      <div class="glass-card" id="addStudentForm" style="display:none;">
        <h4>إضافة طالب جديد</h4>
        <input id="newStudentName" placeholder="الاسم الكامل">
        <input id="newStudentAge" placeholder="السن" type="number">
        <select id="newStudentLevel">${appState.levels.map(l=>`<option value="${l.id}">${l.name}</option>`)}</select>
        <button class="btn-primary" onclick="addNewStudent()">حفظ في قاعدة البيانات</button>
        <button class="btn-outline" onclick="document.getElementById('addStudentForm').style.display='none'">إلغاء</button>
      </div>
    `;
  }

  async function renderLevelsView() {
    let cards = '';
    appState.levels.forEach(l => {
      cards += `<div class="glass-card">
        <h4>${l.name}</h4>
        <p>المنهج: ${l.curriculum || 'غير محدد'}</p>
        <p>رابط المحتوى: ${l.content_url ? `<a href="${l.content_url}" target="_blank">عرض المحتوى التعليمي</a>` : 'لا يوجد'}</p>
        <button class="btn-outline" onclick="editLevelContent(${l.id})">تعديل المحتوى</button>
      </div>`;
    });
    return `
      <div class="glass-card"><h3>إدارة المستويات والمحتوى</h3><button class="btn-primary" onclick="showAddLevelForm()">إضافة مستوى جديد</button></div>
      ${cards}
      <div class="glass-card" id="addLevelForm" style="display:none;">
        <input id="levelName" placeholder="اسم المستوى"><input id="levelCurriculum" placeholder="وصف المنهج"><input id="levelContentUrl" placeholder="رابط المحتوى">
        <button class="btn-primary" onclick="addNewLevel()">حفظ المستوى</button><button class="btn-outline" onclick="document.getElementById('addLevelForm').style.display='none'">إلغاء</button>
      </div>
    `;
  }

  function renderLeaderboard() {
    let sorted = [...appState.students].sort((a,b) => (b.points||0) - (a.points||0));
    return `<div class="glass-card"><h3>🏆 المتصدرين</h3><ol>${sorted.map(s=>`<li>${s.name} - ${s.points||0} نقطة</li>`).join('')}</ol></div>`;
  }

  // ========== عمليات قاعدة البيانات ==========
  async function addNewStudent() {
    const name = document.getElementById('newStudentName').value;
    const age = document.getElementById('newStudentAge').value;
    const level_id = document.getElementById('newStudentLevel').value;
    if (!name) return alert('الاسم مطلوب');
    const qr_token = Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
    const { error } = await supabase.from('students').insert([{ name, age: parseInt(age)||null, level_id: parseInt(level_id)||null, qr_token }]);
    if (error) alert(error.message);
    else { alert('تم إضافة الطالب'); document.getElementById('addStudentForm').style.display='none'; renderView('students'); }
  }

  async function addNewLevel() {
    const name = document.getElementById('levelName').value;
    const curriculum = document.getElementById('levelCurriculum').value;
    const content_url = document.getElementById('levelContentUrl').value;
    if (!name) return alert('الاسم مطلوب');
    const { error } = await supabase.from('levels').insert([{ name, curriculum, content_url }]);
    if (!error) { alert('تمت الإضافة'); renderView('levels'); } else alert(error.message);
  }

  // ========== QR Code ==========
  window.generateQRCode = (token, name) => {
    // تم تعديل الرابط ليطابق اسم المستودع الخاص بك
    const url = `https://marwan909.github.io/Academy-/?qr_token=${token}`;
    const qrDiv = document.createElement('div');
    qrDiv.className = 'modal';
    qrDiv.innerHTML = `<div class="glass-card" style="text-align:center;"><h4>كود الدخول لـ ${name}</h4><div id="qrcodeCanvas" style="display:flex; justify-content:center;"></div><p>امسح الكود لمتابعة ابنك</p><button class="btn-primary" onclick="this.parentElement.parentElement.remove()">إغلاق</button></div>`;
    document.body.appendChild(qrDiv);
    new QRCode(document.getElementById("qrcodeCanvas"), { text: url, width: 200, height: 200 });
  };

  // ========== دوال مساعدة ==========
  window.showParentQRLogin = () => document.getElementById('qrModal').style.display = 'flex';
  window.loginWithToken = () => alert('سيتم تطوير الدخول برمز QR قريباً');
  window.toggleDarkMode = () => document.body.classList.toggle('dark-mode');
  window.showAddStudentForm = () => document.getElementById('addStudentForm').style.display='block';
  window.showAddLevelForm = () => document.getElementById('addLevelForm').style.display='block';
  window.editStudentPrompt = (id) => { const newName = prompt('الاسم الجديد'); if(newName) supabase.from('students').update({name:newName}).eq('id',id).then(()=>renderView('students')); };
  window.editLevelContent = (id) => { const newUrl = prompt('رابط المحتوى الجديد'); if(newUrl) supabase.from('levels').update({content_url:newUrl}).eq('id',id).then(()=>renderView('levels')); };

  // ========== ربط الأحداث ==========
  document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', (e) => renderView(btn.dataset.view)));
  window.addEventListener('load', async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainAppInterface').style.display = 'flex';
      await loadUserProfile(currentUser);
      await fetchInitialData();
      renderView('dashboard');
    }
  });
</script>
</body>
</html>
