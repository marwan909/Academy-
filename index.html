<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technova Academy - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 450px; padding: 2.5rem; }
    h2 { color: #1a202c; text-align: center; margin-bottom: 0.5rem; }
    .subtitle { text-align: center; color: #718096; margin-bottom: 2rem; }
    .input-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #4a5568; font-weight: 500; }
    input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #667eea; }
    button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, background 0.2s; }
    button:hover { background: #5a67d8; transform: translateY(-2px); }
    .message { padding: 12px; border-radius: 8px; margin: 1rem 0; display: none; }
    .error { background: #fed7d7; color: #c53030; border: 1px solid #fc8181; }
    .success { background: #c6f6d5; color: #276749; border: 1px solid #9ae6b4; }
    .info { background: #e2e8f0; color: #2d3748; padding: 1rem; border-radius: 12px; margin: 1rem 0; font-size: 0.9rem; }
    .quick-login { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 1rem; }
    .quick-btn { background: #edf2f7; color: #4a5568; padding: 8px; border: 1px solid #cbd5e0; font-size: 0.85rem; }
    .quick-btn:hover { background: #e2e8f0; transform: none; }
  </style>
</head>
<body>

<div class="container">
  <h2><i class="fas fa-cube" style="color: #667eea;"></i> Technova Academy</h2>
  <p class="subtitle">نظام إدارة STEM المتكامل</p>
  
  <div id="errorMsg" class="message error"></div>
  <div id="successMsg" class="message success"></div>
  <div id="loadingMsg" style="text-align: center; margin: 1rem 0; display: none; color: #667eea;">
    <i class="fas fa-spinner fa-spin"></i> جاري الاتصال...
  </div>
  
  <div class="input-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="admin@technova.com" value="admin@technova.com" dir="ltr">
  </div>
  
  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••" dir="ltr">
  </div>
  
  <button onclick="login()">
    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
  </button>
  
  <div class="info">
    <strong><i class="fas fa-lightbulb"></i> جرب أحد الحلول السريعة:</strong>
  </div>
  
  <div class="quick-login">
    <button class="quick-btn" onclick="fillCredentials('admin@technova.com', 'admin')">
      admin / admin
    </button>
    <button class="quick-btn" onclick="fillCredentials('admin@technova.com', '123456')">
      admin / 123456
    </button>
    <button class="quick-btn" onclick="showCreateUserGuide()">
      <i class="fas fa-user-plus"></i> إنشاء جديد
    </button>
  </div>
  
  <div style="margin-top: 1rem; text-align: center;">
    <button onclick="testConnection()" style="background: transparent; border: 1px solid #cbd5e0; color: #4a5568;">
      <i class="fas fa-database"></i> اختبار الاتصال
    </button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://tdmpkewggmtrjgtaqpiv.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbXBrZXdnZ210cmpndGFxcGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NjE4NDUsImV4cCI6MjA5MTUzNzg0NX0.FYOC74kWTORjxSktZdAotnE50_9BkorwphAtkew-38Q';
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }

  function fillCredentials(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
    showSuccess(`✅ تم تعبئة البيانات: ${email} / ${password}`);
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
      showError('❌ الرجاء إدخال البريد الإلكتروني وكلمة المرور');
      return;
    }
    
    document.getElementById('loadingMsg').style.display = 'block';
    showError('');
    
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        if (error.message.includes('Invalid login credentials')) {
          showError('❌ بيانات الدخول غير صحيحة. جرب كلمة مرور مختلفة أو أنشئ مستخدم جديد');
        } else if (error.message.includes('Email not confirmed')) {
          showError('❌ البريد الإلكتروني غير مفعل. اذهب إلى Supabase وفعّل المستخدم');
        } else {
          showError('❌ ' + error.message);
        }
        return;
      }
      
      if (data.user) {
        showSuccess('✅ تم تسجيل الدخول بنجاح! جاري تحويلك...');
        
        // إنشاء البروفايل إذا لم يكن موجوداً
        const { data: profile } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', data.user.id)
          .single();
        
        if (!profile) {
          await supabase.from('profiles').insert({
            id: data.user.id,
            full_name: email.split('@')[0],
            role: 'admin'
          });
        }
        
        // الانتقال للوحة التحكم
        setTimeout(() => {
          window.location.href = '?logged_in=true&user=' + email;
        }, 1000);
      }
    } catch (err) {
      showError('❌ حدث خطأ: ' + err.message);
    } finally {
      document.getElementById('loadingMsg').style.display = 'none';
    }
  }

  async function testConnection() {
    try {
      const { data, error } = await supabase.from('students').select('count');
      if (error) throw error;
      showSuccess('✅ الاتصال بقاعدة البيانات ناجح!');
    } catch (err) {
      showError('❌ فشل الاتصال: ' + err.message);
    }
  }

  function showCreateUserGuide() {
    alert(`
      لإنشاء مستخدم جديد في Supabase:
      
      1. اذهب إلى: https://supabase.com/dashboard/project/tdmpkewggmtrjgtaqpiv
      2. اختر Authentication → Users
      3. اضغط "Add user" → "Create new user"
      4. استخدم بريد إلكتروني مختلف عن الموجود
      5. كلمة المرور: 123456
      6. فعّل "Auto Confirm User"
      
      بعدها ارجع وجرب الدخول بالبريد الجديد!
    `);
  }

  // تجربة تلقائية للاتصال
  window.addEventListener('load', () => {
    testConnection();
  });
</script>
</body>
</html>
