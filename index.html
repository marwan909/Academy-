<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Technova Academy | اختبار الاتصال</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: #0f172a; min-height: 100vh; color: #f8fafc; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .status-card { background: #1e293b; border-radius: 20px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #334155; }
    .status-title { font-size: 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
    .status-badge { padding: 4px 12px; border-radius: 30px; font-size: 0.9rem; }
    .success { background: #10b981; color: white; }
    .error { background: #ef4444; color: white; }
    .warning { background: #f59e0b; color: white; }
    .loading { background: #3b82f6; color: white; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1e293b; border-radius: 16px; padding: 1.5rem; text-align: center; border: 1px solid #334155; }
    .stat-card i { font-size: 2rem; color: #3b82f6; margin-bottom: 10px; }
    
    .card { background: #1e293b; border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #334155; }
    h3 { margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid #334155; }
    .badge { background: #3b82f6; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
    
    button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 5px; }
    button.danger { background: #ef4444; }
    button.success { background: #10b981; }
    
    input, select { padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; width: 100%; margin-bottom: 10px; }
    
    .log-box { background: #0f172a; padding: 1rem; border-radius: 12px; font-family: monospace; font-size: 0.9rem; max-height: 300px; overflow: auto; white-space: pre-wrap; }
    .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>

<div class="container">
  <!-- حالة الاتصال -->
  <div class="status-card">
    <div class="status-title">
      <i class="fas fa-database"></i>
      <span>حالة الاتصال بقاعدة البيانات</span>
      <span id="connectionStatus" class="status-badge loading">جاري الفحص...</span>
    </div>
    <div class="flex-row">
      <button onclick="checkConnection()"><i class="fas fa-sync-alt"></i> إعادة الفحص</button>
      <button onclick="testRead()" class="success"><i class="fas fa-book"></i> اختبار قراءة البيانات</button>
      <button onclick="testWrite()" class="warning"><i class="fas fa-pen"></i> اختبار كتابة البيانات</button>
    </div>
    <div id="connectionLog" class="log-box" style="margin-top: 1rem;">اضغط على أزرار الاختبار...</div>
  </div>
  
  <!-- إحصائيات -->
  <div class="stats-grid">
    <div class="stat-card">
      <i class="fas fa-users"></i>
      <h3 id="studentCount">-</h3>
      <p>الطلاب</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-layer-group"></i>
      <h3 id="levelCount">-</h3>
      <p>المستويات</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-check-circle"></i>
      <h3 id="tableStatus">-</h3>
      <p>حالة الجداول</p>
    </div>
  </div>
  
  <!-- إضافة طالب -->
  <div class="card">
    <h3><i class="fas fa-plus"></i> إضافة طالب (اختبار الكتابة)</h3>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
      <input type="text" id="studentName" placeholder="اسم الطالب" value="طالب تجريبي">
      <input type="number" id="studentAge" placeholder="العمر" value="12">
      <select id="studentLevel"></select>
      <button onclick="addTestStudent()"><i class="fas fa-save"></i> حفظ</button>
    </div>
  </div>
  
  <!-- قائمة الطلاب -->
  <div class="card">
    <h3><i class="fas fa-list"></i> الطلاب الموجودين في قاعدة البيانات</h3>
    <button onclick="loadStudents()" style="margin-bottom: 1rem;"><i class="fas fa-refresh"></i> تحديث القائمة</button>
    <div style="overflow-x: auto;">
      <table><thead><tr><th>الاسم</th><th>العمر</th><th>المستوى</th><th>النقاط</th><th>QR Token</th></tr></thead>
        <tbody id="studentsList"><tr><td colspan="5" style="text-align:center;">اضغط "تحديث القائمة"</td></tr></tbody>
      </table>
    </div>
  </div>
  
  <!-- سجل الأخطاء التفصيلي -->
  <div class="card">
    <h3><i class="fas fa-terminal"></i> سجل العمليات</h3>
    <div id="fullLog" class="log-box">في انتظار العمليات...</div>
    <button onclick="clearLog()" style="margin-top: 1rem;">مسح السجل</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://tdmpkewggmtrjgtaqpiv.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbXBrZXdnZ210cmpndGFxcGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NjE4NDUsImV4cCI6MjA5MTUzNzg0NX0.FYOC74kWTORjxSktZdAotnE50_9BkorwphAtkew-38Q';
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let logMessages = [];

  // إضافة رسالة للسجل
  function addLog(message, type = 'info') {
    const timestamp = new Date().toLocaleTimeString('ar-EG');
    const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : '📝';
    const logEntry = `[${timestamp}] ${prefix} ${message}`;
    logMessages.push(logEntry);
    
    // عرض في سجل الاتصال
    document.getElementById('connectionLog').textContent = logMessages.slice(-5).join('\n');
    
    // عرض في السجل الكامل
    document.getElementById('fullLog').textContent = logMessages.join('\n');
  }

  // مسح السجل
  function clearLog() {
    logMessages = [];
    document.getElementById('connectionLog').textContent = 'تم مسح السجل';
    document.getElementById('fullLog').textContent = 'تم مسح السجل';
  }

  // فحص الاتصال
  async function checkConnection() {
    addLog('بدء فحص الاتصال...');
    document.getElementById('connectionStatus').className = 'status-badge loading';
    document.getElementById('connectionStatus').textContent = 'جاري الفحص...';
    
    try {
      // فحص الاتصال الأساسي
      const { data: healthData, error: healthError } = await supabase.from('levels').select('count', { count: 'exact', head: true });
      
      if (healthError) {
        addLog(`فشل الاتصال: ${healthError.message}`, 'error');
        document.getElementById('connectionStatus').className = 'status-badge error';
        document.getElementById('connectionStatus').textContent = 'فشل الاتصال';
        document.getElementById('tableStatus').textContent = 'خطأ';
        return;
      }
      
      addLog('✅ الاتصال بقاعدة البيانات ناجح!', 'success');
      document.getElementById('connectionStatus').className = 'status-badge success';
      document.getElementById('connectionStatus').textContent = 'متصل';
      
      // فحص الجداول
      const tables = ['students', 'levels', 'profiles'];
      let workingTables = 0;
      
      for (const table of tables) {
        const { error } = await supabase.from(table).select('count', { count: 'exact', head: true });
        if (!error) {
          workingTables++;
          addLog(`✅ جدول ${table} موجود`, 'success');
        } else {
          addLog(`❌ جدول ${table}: ${error.message}`, 'error');
        }
      }
      
      document.getElementById('tableStatus').textContent = `${workingTables}/${tables.length}`;
      
      // تحميل الإحصائيات
      await loadStats();
      await loadLevelsForSelect();
      
    } catch (err) {
      addLog(`خطأ غير متوقع: ${err.message}`, 'error');
      document.getElementById('connectionStatus').className = 'status-badge error';
      document.getElementById('connectionStatus').textContent = 'خطأ';
    }
  }

  // تحميل الإحصائيات
  async function loadStats() {
    try {
      const [studentsRes, levelsRes] = await Promise.all([
        supabase.from('students').select('*', { count: 'exact', head: true }),
        supabase.from('levels').select('*', { count: 'exact', head: true })
      ]);
      
      document.getElementById('studentCount').textContent = studentsRes.count || 0;
      document.getElementById('levelCount').textContent = levelsRes.count || 0;
      addLog(`تم تحميل الإحصائيات: ${studentsRes.count} طالب، ${levelsRes.count} مستوى`, 'success');
    } catch (err) {
      addLog(`خطأ في تحميل الإحصائيات: ${err.message}`, 'error');
    }
  }

  // تحميل المستويات للقائمة المنسدلة
  async function loadLevelsForSelect() {
    try {
      const { data, error } = await supabase.from('levels').select('*');
      if (error) throw error;
      
      const select = document.getElementById('studentLevel');
      select.innerHTML = '<option value="">اختر المستوى</option>' + 
        (data || []).map(l => `<option value="${l.id}">${l.name}</option>`).join('');
      
      addLog(`تم تحميل ${data.length} مستوى للقائمة`, 'success');
    } catch (err) {
      addLog(`خطأ في تحميل المستويات: ${err.message}`, 'error');
    }
  }

  // تحميل الطلاب
  async function loadStudents() {
    addLog('جاري تحميل قائمة الطلاب...');
    
    try {
      const { data, error } = await supabase.from('students').select('*');
      
      if (error) {
        addLog(`خطأ في تحميل الطلاب: ${error.message}`, 'error');
        document.getElementById('studentsList').innerHTML = `<tr><td colspan="5" style="text-align:center; color: #ef4444;">خطأ: ${error.message}</td></tr>`;
        return;
      }
      
      if (!data || data.length === 0) {
        document.getElementById('studentsList').innerHTML = '<tr><td colspan="5" style="text-align:center;">لا يوجد طلاب في قاعدة البيانات</td></tr>';
        addLog('لا يوجد طلاب مسجلين', 'info');
        return;
      }
      
      // تحميل المستويات عشان نعرف اسم المستوى
      const { data: levels } = await supabase.from('levels').select('*');
      
      const html = data.map(s => {
        const level = levels?.find(l => l.id === s.level_id);
        return `<tr>
          <td>${s.name}</td>
          <td>${s.age || '-'}</td>
          <td><span class="badge">${level?.name || 'بدون مستوى'}</span></td>
          <td>${s.points || 0}</td>
          <td style="font-family: monospace; font-size: 0.7rem;">${s.qr_token || '-'}</td>
        </tr>`;
      }).join('');
      
      document.getElementById('studentsList').innerHTML = html;
      document.getElementById('studentCount').textContent = data.length;
      addLog(`✅ تم تحميل ${data.length} طالب`, 'success');
      
    } catch (err) {
      addLog(`خطأ: ${err.message}`, 'error');
    }
  }

  // اختبار القراءة
  async function testRead() {
    addLog('اختبار قراءة البيانات...');
    
    try {
      const { data, error } = await supabase.from('levels').select('*');
      
      if (error) {
        addLog(`❌ فشل القراءة: ${error.message}`, 'error');
      } else {
        addLog(`✅ نجحت القراءة! تم جلب ${data.length} مستوى: ${data.map(l => l.name).join(', ')}`, 'success');
      }
    } catch (err) {
      addLog(`خطأ: ${err.message}`, 'error');
    }
  }

  // اختبار الكتابة
  async function testWrite() {
    addLog('اختبار كتابة البيانات...');
    
    try {
      const testData = {
        name: 'اختبار ' + new Date().toLocaleTimeString('ar-EG'),
        curriculum: 'منهج تجريبي',
        content_url: 'https://example.com'
      };
      
      const { data, error } = await supabase.from('levels').insert([testData]).select();
      
      if (error) {
        addLog(`❌ فشل الكتابة: ${error.message}`, 'error');
        
        if (error.message.includes('row-level security')) {
          addLog('⚠️ المشكلة في سياسات RLS - يجب تفعيلها في Supabase', 'error');
        }
      } else {
        addLog(`✅ نجحت الكتابة! تم إضافة: ${data[0].name}`, 'success');
        await loadLevelsForSelect();
        await loadStats();
      }
    } catch (err) {
      addLog(`خطأ: ${err.message}`, 'error');
    }
  }

  // إضافة طالب تجريبي
  async function addTestStudent() {
    const name = document.getElementById('studentName').value;
    const age = document.getElementById('studentAge').value;
    const level_id = document.getElementById('studentLevel').value;
    
    if (!name) {
      addLog('الرجاء إدخال اسم الطالب', 'error');
      return;
    }
    
    addLog(`جاري إضافة الطالب: ${name}...`);
    
    try {
      const qr_token = 'qr_' + Math.random().toString(36) + Date.now().toString(36);
      const { data, error } = await supabase.from('students').insert([{
        name, 
        age: parseInt(age) || null,
        level_id: parseInt(level_id) || null,
        qr_token, 
        points: 0
      }]).select();
      
      if (error) {
        addLog(`❌ فشل الإضافة: ${error.message}`, 'error');
        
        if (error.message.includes('row-level security')) {
          addLog('⚠️ المشكلة في RLS - نفذ كود SQL اللي شرحته', 'error');
        }
      } else {
        addLog(`✅ تم إضافة الطالب "${data[0].name}" بنجاح!`, 'success');
        document.getElementById('studentName').value = '';
        document.getElementById('studentAge').value = '';
        await loadStudents();
        await loadStats();
      }
    } catch (err) {
      addLog(`خطأ: ${err.message}`, 'error');
    }
  }

  // بدء التشغيل
  window.addEventListener('load', () => {
    addLog('🚀 تم تحميل صفحة اختبار الاتصال');
    addLog(`📡 Supabase URL: ${SUPABASE_URL}`);
    checkConnection();
  });
</script>
</body>
</html>
