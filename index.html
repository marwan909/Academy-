<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Technova Academy | STEM Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
/* ======================== RESET & VARS ======================== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
:root {
  --bg:        #0a0f1e;
  --bg2:       #111827;
  --bg3:       #1a2235;
  --border:    #1e3a5f;
  --text:      #e2e8f0;
  --text2:     #94a3b8;
  --accent:    #00d4ff;
  --accent2:   #7c3aed;
  --accent3:   #10b981;
  --danger:    #ef4444;
  --warning:   #f59e0b;
  --glow:      0 0 20px #00d4ff40;
  --glow2:     0 0 30px #7c3aed40;
  --r:         16px;
  --r2:        24px;
  --sidebar-w: 260px;
}
.light {
  --bg:#f0f4ff; --bg2:#ffffff; --bg3:#e8eef8;
  --border:#cbd5e1; --text:#0f172a; --text2:#475569;
  --glow:0 2px 12px #3b82f640; --glow2:0 2px 12px #7c3aed30;
}

/* ======================== SCROLLBAR ======================== */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(–bg2); }
::-webkit-scrollbar-thumb { background:var(–border); border-radius:3px; }

/* ======================== BODY ======================== */
body { background:var(–bg); color:var(–text); min-height:100vh; transition:.3s; }

/* ======================== AUTH ======================== */
#authScreen {
min-height:100vh; display:flex; align-items:center; justify-content:center;
background: radial-gradient(ellipse at 60% 40%, #0d1f3c 0%, #0a0f1e 70%);
}
.auth-box {
width:380px; padding:2.5rem; background:var(–bg2);
border-radius:var(–r2); border:1px solid var(–border);
box-shadow: var(–glow2); text-align:center;
}
.auth-box .logo-icon { font-size:3.5rem; color:var(–accent); display:block; margin-bottom:.5rem;
animation: pulse-glow 2s ease-in-out infinite; }
@keyframes pulse-glow {
0%,100% { filter:drop-shadow(0 0 8px var(–accent)); }
50%      { filter:drop-shadow(0 0 20px var(–accent)); }
}
.auth-box h2 { font-size:1.6rem; font-weight:900; background:linear-gradient(135deg,var(–accent),var(–accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.auth-box p  { color:var(–text2); font-size:.9rem; margin-bottom:1.5rem; }

/* ======================== LAYOUT ======================== */
#appWrap { display:flex; min-height:100vh; }

/* ======================== SIDEBAR ======================== */
.sidebar {
width:var(–sidebar-w); background:var(–bg2); border-left:1px solid var(–border);
display:flex; flex-direction:column; padding:1.25rem .75rem;
position:sticky; top:0; height:100vh; overflow-y:auto;
box-shadow: 4px 0 24px #00000040;
}
.sidebar-logo { display:flex; align-items:center; gap:10px; padding:.5rem .75rem 1.5rem; }
.sidebar-logo i { font-size:2rem; color:var(–accent); filter:drop-shadow(0 0 8px var(–accent)); }
.sidebar-logo h2 { font-size:1.2rem; font-weight:900; line-height:1.2; }
.sidebar-logo small { color:var(–text2); font-size:.72rem; display:block; }

.nav-item {
width:100%; display:flex; align-items:center; gap:10px;
padding:10px 14px; border-radius:var(–r); border:none;
background:transparent; color:var(–text2); cursor:pointer;
transition:.2s; text-align:right; font-size:.88rem; font-weight:600;
margin-bottom:2px;
}
.nav-item:hover  { background:var(–bg3); color:var(–text); }
.nav-item.active { background:linear-gradient(135deg,#00d4ff18,#7c3aed18); color:var(–accent); border:1px solid var(–border); }
.nav-item i      { width:20px; text-align:center; font-size:.95rem; }
.nav-section     { font-size:.7rem; color:var(–text2); padding:10px 14px 4px; font-weight:700; letter-spacing:.05em; }

.sidebar-bottom { margin-top:auto; padding-top:1rem; border-top:1px solid var(–border); display:flex; flex-direction:column; gap:6px; }
.sidebar-bottom button { background:var(–bg3); color:var(–text); border:1px solid var(–border); padding:8px 14px; border-radius:var(–r); cursor:pointer; font-size:.82rem; font-family:‘Cairo’,sans-serif; font-weight:600; }

/* ======================== MAIN ======================== */
.main { flex:1; padding:1.5rem; overflow-y:auto; min-width:0; }
.page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:.75rem; }
.page-title  { font-size:1.4rem; font-weight:900; }
.user-badge  { display:flex; align-items:center; gap:8px; background:var(–bg2); padding:6px 14px; border-radius:40px; border:1px solid var(–border); font-size:.82rem; }
.user-badge i { color:var(–accent); }

/* ======================== CARDS ======================== */
.card {
background:var(–bg2); border-radius:var(–r2); border:1px solid var(–border);
padding:1.25rem; box-shadow: var(–glow);
}
.card-title { font-size:1rem; font-weight:800; margin-bottom:1rem; display:flex; align-items:center; gap:8px; }
.grid { display:grid; gap:1rem; }
.grid-2 { grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
.grid-3 { grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
.grid-4 { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }

/* Stat card */
.stat-card {
background:var(–bg2); border:1px solid var(–border); border-radius:var(–r2);
padding:1.25rem; display:flex; flex-direction:column; gap:.5rem; position:relative; overflow:hidden;
}
.stat-card::before { content:’’; position:absolute; top:-40px; right:-40px; width:100px; height:100px; border-radius:50%; opacity:.08; }
.stat-card.blue::before  { background:var(–accent);  box-shadow:0 0 60px var(–accent); }
.stat-card.purple::before{ background:var(–accent2); box-shadow:0 0 60px var(–accent2); }
.stat-card.green::before { background:var(–accent3); box-shadow:0 0 60px var(–accent3); }
.stat-card.orange::before{ background:var(–warning); box-shadow:0 0 60px var(–warning); }
.stat-icon { font-size:1.6rem; }
.stat-num  { font-size:2rem; font-weight:900; line-height:1; }
.stat-lbl  { font-size:.8rem; color:var(–text2); }
.stat-card.blue   .stat-num { color:var(–accent); }
.stat-card.purple .stat-num { color:var(–accent2); }
.stat-card.green  .stat-num { color:var(–accent3); }
.stat-card.orange .stat-num { color:var(–warning); }

/* ======================== INPUTS & FORMS ======================== */
.input-field, select.input-field, textarea.input-field {
width:100%; background:var(–bg3); border:1px solid var(–border);
padding:10px 14px; border-radius:var(–r); color:var(–text);
font-family:‘Cairo’,sans-serif; font-size:.88rem;
transition:.2s; outline:none;
}
.input-field:focus { border-color:var(–accent); box-shadow:0 0 0 3px #00d4ff18; }
.form-group { margin-bottom:.85rem; }
.form-label { font-size:.8rem; color:var(–text2); font-weight:700; margin-bottom:.35rem; display:block; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
@media(max-width:500px){ .form-row{ grid-template-columns:1fr; } }

/* ======================== BUTTONS ======================== */
.btn { padding:9px 18px; border-radius:40px; border:none; cursor:pointer; font-family:‘Cairo’,sans-serif; font-weight:700; font-size:.85rem; transition:.2s; display:inline-flex; align-items:center; gap:7px; }
.btn-primary { background:linear-gradient(135deg,var(–accent),#0099cc); color:#000; }
.btn-primary:hover { filter:brightness(1.1); transform:translateY(-1px); }
.btn-secondary { background:var(–accent2); color:white; }
.btn-success   { background:var(–accent3); color:white; }
.btn-danger    { background:var(–danger); color:white; }
.btn-ghost     { background:var(–bg3); color:var(–text); border:1px solid var(–border); }
.btn-ghost:hover { border-color:var(–accent); }
.btn-sm { padding:5px 11px; font-size:.78rem; }
.btn-icon { padding:7px; border-radius:var(–r); background:var(–bg3); border:1px solid var(–border); color:var(–text2); cursor:pointer; transition:.2s; }
.btn-icon:hover { color:var(–accent); border-color:var(–accent); }

/* ======================== TABLE ======================== */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
thead th {
padding:10px 14px; text-align:right; font-size:.78rem; font-weight:800;
color:var(–text2); border-bottom:1px solid var(–border); letter-spacing:.03em;
text-transform:uppercase;
}
tbody td { padding:10px 14px; border-bottom:1px solid var(–border); font-size:.85rem; }
tbody tr:hover { background:var(–bg3); }
tbody tr:last-child td { border-bottom:none; }
.avatar-sm {
width:36px; height:36px; border-radius:50%; object-fit:cover;
border:2px solid var(–border); background:var(–bg3);
display:inline-flex; align-items:center; justify-content:center;
font-size:.9rem; color:var(–accent); font-weight:700;
}

/* ======================== BADGES ======================== */
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:40px; font-size:.72rem; font-weight:700; }
.badge-blue   { background:#00d4ff18; color:var(–accent); border:1px solid #00d4ff30; }
.badge-purple { background:#7c3aed18; color:#a78bfa;      border:1px solid #7c3aed30; }
.badge-green  { background:#10b98118; color:var(–accent3);border:1px solid #10b98130; }
.badge-orange { background:#f59e0b18; color:var(–warning); border:1px solid #f59e0b30; }
.badge-red    { background:#ef444418; color:var(–danger);  border:1px solid #ef444430; }

/* ======================== SKILL BARS ======================== */
.skill-row { display:flex; align-items:center; gap:10px; margin-bottom:.5rem; }
.skill-lbl { font-size:.78rem; color:var(–text2); width:80px; flex-shrink:0; }
.skill-bar-wrap { flex:1; height:7px; background:var(–bg3); border-radius:4px; overflow:hidden; }
.skill-bar { height:100%; border-radius:4px; transition:width .8s cubic-bezier(.4,0,.2,1); }
.skill-val { font-size:.75rem; color:var(–text2); width:18px; flex-shrink:0; }

/* ======================== RATING STARS ======================== */
.stars { display:flex; gap:3px; }
.star  { font-size:.9rem; cursor:pointer; transition:.15s; }
.star.on { color:var(–warning); }
.star.off{ color:var(–border); }

/* ======================== MODAL ======================== */
.modal-overlay {
position:fixed; inset:0; background:#000a; backdrop-filter:blur(8px);
display:flex; align-items:center; justify-content:center;
z-index:1000; padding:1rem; animation:fadeIn .2s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-box {
background:var(–bg2); border-radius:var(–r2); border:1px solid var(–border);
padding:1.75rem; width:100%; max-width:520px;
box-shadow: var(–glow2); animation:slideUp .25s ease;
max-height:90vh; overflow-y:auto;
}
@keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
.modal-title  { font-size:1.1rem; font-weight:800; }
.modal-close  { background:none; border:none; color:var(–text2); cursor:pointer; font-size:1.1rem; }
.modal-close:hover { color:var(–danger); }

/* ======================== NOTIFICATIONS ======================== */
.notif-dot {
position:absolute; top:-3px; right:-3px; width:8px; height:8px;
border-radius:50%; background:var(–danger); animation:pulse-dot 1.5s infinite;
}
@keyframes pulse-dot {
0%,100%{ transform:scale(1); }
50%    { transform:scale(1.4); }
}
.notif-card {
display:flex; gap:10px; align-items:flex-start;
padding:.75rem; border-radius:var(–r); background:var(–bg3);
border:1px solid var(–border); margin-bottom:.5rem;
}
.notif-icon { font-size:1.2rem; margin-top:2px; }
.notif-msg  { font-size:.85rem; font-weight:600; }
.notif-time { font-size:.72rem; color:var(–text2); }

/* ======================== ATTENDANCE ======================== */
.attend-dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
.attend-p   { background:var(–accent3); }
.attend-a   { background:var(–danger); }
.attend-e   { background:var(–warning); }

/* ======================== LEADERBOARD ======================== */
.lb-row {
display:flex; align-items:center; gap:12px; padding:10px 14px;
border-radius:var(–r); background:var(–bg3); margin-bottom:.5rem;
border:1px solid var(–border); transition:.2s;
}
.lb-row:hover { border-color:var(–accent); }
.lb-rank { font-size:1.2rem; font-weight:900; width:32px; text-align:center; }
.lb-name { flex:1; font-weight:700; font-size:.9rem; }
.lb-pts  { font-size:.85rem; color:var(–accent); font-weight:700; }

/* ======================== AI CARD ======================== */
.ai-response {
background:linear-gradient(135deg,#00d4ff10,#7c3aed10);
border:1px solid var(–border); border-radius:var(–r);
padding:1rem; font-size:.88rem; line-height:1.8; white-space:pre-wrap;
}
.ai-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; background:linear-gradient(135deg,#00d4ff,#7c3aed); border-radius:40px; font-size:.72rem; color:white; font-weight:700; margin-bottom:.75rem; }

/* ======================== PROFILE PAGE ======================== */
.profile-header {
display:flex; align-items:center; gap:1.5rem;
padding:1.5rem; background:linear-gradient(135deg,#00d4ff10,#7c3aed10);
border-radius:var(–r2); border:1px solid var(–border); margin-bottom:1rem;
}
.profile-avatar {
width:80px; height:80px; border-radius:50%; background:var(–bg3);
border:3px solid var(–accent); display:flex; align-items:center; justify-content:center;
font-size:2rem; font-weight:900; color:var(–accent); flex-shrink:0;
}
.progress-ring { display:flex; gap:1rem; flex-wrap:wrap; }

/* ======================== CHART CONTAINER ======================== */
.chart-wrap { position:relative; height:200px; }

/* ======================== TOAST ======================== */
.toast-wrap { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:.5rem; align-items:center; pointer-events:none; }
.toast {
padding:10px 20px; border-radius:40px; font-size:.85rem; font-weight:700;
animation:toastIn .3s ease; pointer-events:none; white-space:nowrap;
}
@keyframes toastIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
.toast-success { background:var(–accent3); color:white; }
.toast-error   { background:var(–danger);  color:white; }
.toast-info    { background:var(–accent);  color:#000; }

/* ======================== RESPONSIVE ======================== */
@media(max-width:768px){
#appWrap { flex-direction:column; }
.sidebar {
width:100%; height:auto; position:relative; padding:.5rem;
flex-direction:row; align-items:center; flex-wrap:wrap; justify-content:space-between;
overflow-x:auto; overflow-y:hidden; border-left:none; border-bottom:1px solid var(–border);
}
.sidebar-logo { padding:.25rem .5rem .25rem; }
.sidebar-logo small, .nav-section { display:none; }
nav.nav-links { display:flex; flex-direction:row; gap:4px; overflow-x:auto; }
.nav-item span { display:none; }
.nav-item { padding:8px 10px; }
.sidebar-bottom { flex-direction:row; padding-top:0; border-top:none; }
.main { padding:1rem; }
.form-row { grid-template-columns:1fr; }
}
</style>

</head>
<body>

<!-- ======================== AUTH ======================== -->

<div id="authScreen">
  <div class="auth-box">
    <i class="fas fa-cube logo-icon"></i>
    <h2>Technova Academy</h2>
    <p>نظام إدارة STEM المتكامل</p>
    <div style="margin:1.5rem 0; display:flex; flex-direction:column; gap:.75rem;">
      <input class="input-field" id="loginEmail" type="email" placeholder="البريد الإلكتروني" value="admin@technova.com">
      <input class="input-field" id="loginPassword" type="password" placeholder="كلمة المرور" value="123456">
      <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> دخول
      </button>
    </div>
    <p style="font-size:.78rem; color:var(--text2);">
      <i class="fas fa-qrcode"></i>
      <a href="#" onclick="showParentQRLogin(); return false;" style="color:var(--accent); text-decoration:none;"> دخول ولي الأمر بـ QR</a>
    </p>
    <div id="authError" style="color:var(--danger); font-size:.82rem; margin-top:.75rem; display:none;"></div>
  </div>
</div>

<!-- ======================== APP ======================== -->

<div id="appWrap" style="display:none;">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-cube"></i>
      <div><h2>Technova</h2><small>STEM Horizon</small></div>
    </div>
    <nav class="nav-links" style="display:flex; flex-direction:column; width:100%;">
      <div class="nav-section">الرئيسية</div>
      <button class="nav-item active" data-view="dashboard"><i class="fas fa-th-large"></i><span>لوحة التحكم</span></button>
      <div class="nav-section">الإدارة</div>
      <button class="nav-item" data-view="students"><i class="fas fa-users"></i><span>الطلاب</span></button>
      <button class="nav-item" data-view="levels"><i class="fas fa-layer-group"></i><span>المستويات</span></button>
      <button class="nav-item" data-view="attendance"><i class="fas fa-calendar-check"></i><span>الحضور</span></button>
      <button class="nav-item" data-view="coaches"><i class="fas fa-chalkboard-user"></i><span>المدربين</span></button>
      <div class="nav-section">التحليل</div>
      <button class="nav-item" data-view="reports"><i class="fas fa-chart-bar"></i><span>التقارير</span></button>
      <button class="nav-item" data-view="leaderboard"><i class="fas fa-trophy"></i><span>المتصدرين</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button onclick="toggleTheme()"><i class="fas fa-moon"></i> تغيير المظهر</button>
      <button onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->

  <div class="main">
    <div class="page-header">
      <div class="page-title" id="viewTitle">لوحة التحكم</div>
      <div style="display:flex; align-items:center; gap:.75rem;">
        <!-- Bell button -->
        <button class="btn-icon" style="position:relative;" onclick="toggleNotifPanel()">
          <i class="fas fa-bell"></i>
          <span class="notif-dot" id="notifDot"></span>
        </button>
        <div class="user-badge"><i class="fas fa-user-circle"></i><span id="userRoleBadge">أدمن</span></div>
      </div>
    </div>
    <!-- Notif Panel -->
    <div id="notifPanel" style="display:none; margin-bottom:1rem;">
      <div class="card" id="notifList"></div>
    </div>
    <!-- Dynamic content -->
    <div id="dynamicContent"></div>
  </div>
</div>

<!-- Toast container -->

<div class="toast-wrap" id="toastWrap"></div>

<!-- QR Modal -->

<div id="qrModal" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="text-align:center; max-width:360px;">
    <div class="modal-header">
      <span class="modal-title">دخول ولي الأمر</span>
      <button class="modal-close" onclick="closeModal('qrModal')"><i class="fas fa-times"></i></button>
    </div>
    <p style="color:var(--text2); font-size:.85rem; margin-bottom:1rem;">امسح كود QR من الكارت أو أدخل الرمز يدوياً</p>
    <input class="input-field" id="qrTokenInput" placeholder="أدخل رمز QR...">
    <button class="btn btn-primary" style="margin-top:.75rem; width:100%; justify-content:center;" onclick="loginWithQR()">
      <i class="fas fa-qrcode"></i> دخول
    </button>
  </div>
</div>

<!-- Student Modal -->

<div id="studentModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="studentModalTitle">إضافة طالب</span>
      <button class="modal-close" onclick="closeModal('studentModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">الاسم الكامل *</label>
        <input class="input-field" id="sName" placeholder="اسم الطالب">
      </div>
      <div class="form-group">
        <label class="form-label">العمر</label>
        <input class="input-field" id="sAge" type="number" placeholder="12" min="5" max="25">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">رقم ولي الأمر</label>
        <input class="input-field" id="sPhone" placeholder="010XXXXXXXX">
      </div>
      <div class="form-group">
        <label class="form-label">المستوى</label>
        <select class="input-field" id="sLevel"></select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظات</label>
      <textarea class="input-field" id="sNotes" rows="2" placeholder="ملاحظات عن الطالب..."></textarea>
    </div>
    <input type="hidden" id="sId">
    <div style="display:flex; gap:.75rem; justify-content:flex-end; margin-top:.5rem;">

<script>
// ==================== SUPABASE ====================
const SUPABASE_URL  = 'https://tdmpkewggmtrjgtaqpiv.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbXBrZXdnZ210cmpndGFxcGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NjE4NDUsImV4cCI6MjA5MTUzNzg0NX0.FYOC74kWTORjxSktZdAotnE50_9BkorwphAtkew-38Q';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==================== STATE ====================
let currentUser   = null;
let userProfile   = null;
let appData       = { students:[], levels:[], coaches:[], notifications:[] };
let sessionRatings = { understanding:0, application:0, behavior:0, logic_score:0, coding_score:0, creativity_score:0 };

// ==================== TOAST ====================
function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ==================== MODAL ====================
function openModal(id)  { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// ==================== AUTH ====================
async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPassword').value;
  document.getElementById('authError').style.display = 'none';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
    if (error) throw error;
    await bootApp(data.user);
  } catch (e) {
    document.getElementById('authError').textContent = 'خطأ: ' + e.message;
    document.getElementById('authError').style.display = 'block';
  }
}

async function bootApp(user) {
  currentUser = user;
  await ensureProfile(user);
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appWrap').style.display    = 'flex';
  document.getElementById('userRoleBadge').textContent = userProfile?.role === 'admin' ? 'مدير النظام' : userProfile?.full_name || 'مستخدم';
  await refreshData();
  buildNotifications();
  renderView('dashboard');
}

async function ensureProfile(user) {
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (!data) {
    await sb.from('profiles').insert({ id: user.id, full_name: user.email, role: 'admin' });
    userProfile = { role: 'admin', full_name: user.email };
  } else { userProfile = data; }
}

async function handleLogout() {
  await sb.auth.signOut();
  location.reload();
}

// ==================== DATA ====================
async function refreshData() {
  const [s, l, c] = await Promise.all([
    sb.from('students').select('*').order('points', { ascending: false }),
    sb.from('levels').select('*'),
    sb.from('profiles').select('*').eq('role', 'coach')
  ]);
  appData.students = s.data || [];
  appData.levels   = l.data || [];
  appData.coaches  = c.data || [];
}

function buildNotifications() {
  appData.notifications = [];
  appData.students.forEach(st => {
    if ((st.points || 0) < 100) appData.notifications.push({ type:'warning', icon:'⚠️', msg:`${st.name} – نقاط منخفضة (${st.points||0})`, time:'الآن' });
  });
}

// ==================== NAVIGATE ====================
async function renderView(viewId) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === viewId));
  const titles = { dashboard:'لوحة التحكم', students:'الطلاب', levels:'المستويات', attendance:'الحضور والغياب', coaches:'المدربين', reports:'التقارير', leaderboard:'المتصدرين' };
  document.getElementById('viewTitle').textContent = titles[viewId] || viewId;
  await refreshData();
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(_){} });
  chartInstances = {};
  const el = document.getElementById('dynamicContent');
  el.innerHTML = '<div style="color:var(--text2); padding:2rem; text-align:center;"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
  switch(viewId) {
    case 'dashboard':   el.innerHTML = buildDashboard();   break;
    case 'students':    el.innerHTML = buildStudents();    break;
    case 'levels':      el.innerHTML = buildLevels();      break;
    case 'attendance':  el.innerHTML = buildAttendance();  break;
    case 'coaches':     el.innerHTML = buildCoaches();     break;
    case 'reports':     el.innerHTML = buildReports();     break;
    case 'leaderboard': el.innerHTML = buildLeaderboard(); break;
  }
  if (viewId === 'dashboard') initDashboardCharts();
  if (viewId === 'reports')   initReportCharts();
  buildNotifPanel();
}

// ==================== NOTIFICATIONS ====================
function buildNotifPanel() {
  const list = document.getElementById('notifList');
  if (!list) return;
  const dot = document.getElementById('notifDot');
  dot.style.display = appData.notifications.length ? 'block' : 'none';
  list.innerHTML = appData.notifications.length
    ? appData.notifications.map(n => `
        <div class="notif-card">
          <div class="notif-icon">${n.icon}</div>
          <div><div class="notif-msg">${n.msg}</div><div class="notif-time">${n.time}</div></div>
        </div>`).join('')
    : '<p style="color:var(--text2); font-size:.85rem; padding:.5rem;">لا توجد إشعارات</p>';
}
function toggleNotifPanel() {
  const p = document.getElementById('notifPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

// ==================== DASHBOARD ====================
function buildDashboard() {
  const totalStudents = appData.students.length;
  const totalLevels   = appData.levels.length;
  const totalCoaches  = appData.coaches.length;
  const avgPoints     = totalStudents ? Math.round(appData.students.reduce((a,s)=>a+(s.points||0),0)/totalStudents) : 0;

  const topStudents = [...appData.students].sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,3);
  const medal = ['🥇','🥈','🥉'];

  return `
  <div class="grid grid-4" style="margin-bottom:1rem;">
    <div class="stat-card blue"><div class="stat-icon">👨‍🎓</div><div class="stat-num">${totalStudents}</div><div class="stat-lbl">إجمالي الطلاب</div></div>
    <div class="stat-card purple"><div class="stat-icon">📚</div><div class="stat-num">${totalLevels}</div><div class="stat-lbl">المستويات</div></div>
    <div class="stat-card green"><div class="stat-icon">👨‍🏫</div><div class="stat-num">${totalCoaches}</div><div class="stat-lbl">المدربين</div></div>
    <div class="stat-card orange"><div class="stat-icon">⚡</div><div class="stat-num">${avgPoints}</div><div class="stat-lbl">متوسط النقاط</div></div>
  </div>
  <div class="grid grid-3">
    <div class="card" style="grid-column:1/3;">
      <div class="card-title"><i class="fas fa-chart-line" style="color:var(--accent);"></i> توزيع الطلاب على المستويات</div>
      <div class="chart-wrap"><canvas id="chartLevels"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-trophy" style="color:var(--warning);"></i> أفضل الطلاب</div>
      ${topStudents.map((s,i)=>`
        <div class="lb-row" style="margin-bottom:.5rem;">
          <div class="lb-rank">${medal[i]}</div>
          <div class="lb-name">${s.name}</div>
          <div class="lb-pts">${s.points||0} نقطة</div>
        </div>`).join('')}
    </div>
    <div class="card" style="grid-column:1/-1;">
      <div class="card-title"><i class="fas fa-bell" style="color:var(--warning);"></i> آخر الإشعارات</div>
      ${appData.notifications.length
        ? appData.notifications.slice(0,3).map(n=>`
            <div class="notif-card"><div class="notif-icon">${n.icon}</div>
              <div><div class="notif-msg">${n.msg}</div><div class="notif-time">${n.time}</div></div>
            </div>`).join('')
        : '<p style="color:var(--text2); font-size:.85rem;">لا توجد إشعارات حالياً ✅</p>'}
    </div>
  </div>`;
}

function initDashboardCharts() {
  const levelCounts = {};
  appData.students.forEach(s => {
    const lv = appData.levels.find(l=>l.id===s.level_id);
    const name = lv ? lv.name : 'بدون مستوى';
    levelCounts[name] = (levelCounts[name]||0)+1;
  });
  const ctx = document.getElementById('chartLevels');
  if (!ctx) return;
  chartInstances.levels = new Chart(ctx, {
    type:'bar',
    data: {
      labels: Object.keys(levelCounts),
      datasets:[{ label:'عدد الطلاب', data: Object.values(levelCounts),
        backgroundColor:['#00d4ff80','#7c3aed80','#10b98180','#f59e0b80'],
        borderColor:['#00d4ff','#7c3aed','#10b981','#f59e0b'], borderWidth:2, borderRadius:8 }]
    },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{grid:{color:'#ffffff10'}, ticks:{color:'#94a3b8'}}, y:{grid:{color:'#ffffff10'}, ticks:{color:'#94a3b8'}} } }

function buildStudents() {
  const rows = appData.students.map(s => {
    const lv = appData.levels.find(l=>l.id===s.level_id);

  return `

  </div>
  <div class="card">
    <div class="table-wrap">
      <table id="studentsTable">
        <thead><tr><th>صورة</th><th>الاسم</th><th>العمر</th><th>الهاتف</th><th>المستوى</th><th>Badges</th><th>نقاط</th><th>إجراءات</th></tr></thead>

window.filterStudentsTable = (q) => {
  const rows = document.querySelectorAll('#studentsTbody tr');
  rows.forEach(r => { r.style.display = r.textContent.includes(q) ? '' : 'none'; });
};

window.openAddStudent = () => {
  document.getElementById('sId').value = '';
  document.getElementById('sName').value = '';
  document.getElementById('sAge').value = '';
  document.getElementById('sPhone').value = '';
  document.getElementById('sNotes').value = '';
  document.getElementById('studentModalTitle').textContent = 'إضافة طالب جديد';
  populateLevelsSelect('sLevel');
  openModal('studentModal');
};

window.openEditStudent = (id) => {
  const s = appData.students.find(x=>x.id===id);
  if (!s) return;
  document.getElementById('sId').value = s.id;
  document.getElementById('sName').value = s.name;
  document.getElementById('sAge').value = s.age||'';
  document.getElementById('sPhone').value = s.parent_phone||'';
  document.getElementById('sNotes').value = s.notes||'';
  document.getElementById('studentModalTitle').textContent = 'تعديل بيانات الطالب';
  populateLevelsSelect('sLevel', s.level_id);
  openModal('studentModal');
};

function populateLevelsSelect(elId, selectedId) {
  const sel = document.getElementById(elId);
  sel.innerHTML = '<option value="">-- اختر مستوى --</option>' +
    appData.levels.map(l => `<option value="${l.id}" ${l.id===selectedId?'selected':''}>${l.name}</option>`).join('');
}

window.saveStudent = async () => {
  const id = document.getElementById('sId').value;
  const data = {
    name:         document.getElementById('sName').value.trim(),
    age:          parseInt(document.getElementById('sAge').value) || null,
    parent_phone: document.getElementById('sPhone').value.trim(),
    level_id:     parseInt(document.getElementById('sLevel').value) || null,
    notes:        document.getElementById('sNotes').value.trim(),
  };
  if (!data.name) return showToast('الاسم مطلوب!', 'error');
  let err;
  if (id) {
    ({ error: err } = await sb.from('students').update(data).eq('id', id));
  } else {
    data.qr_token = Math.random().toString(36).slice(2) + Date.now().toString(36);
    data.points = 0; data.badges = [];
    ({ error: err } = await sb.from('students').insert([data]));
  }
  if (err) return showToast('خطأ: ' + err.message, 'error');
  closeModal('studentModal');
  showToast(id ? 'تم التعديل ✅' : 'تمت الإضافة ✅', 'success');
  await renderView('students');
};

window.deleteStudent = async (id) => {
  if (!confirm('هتحذف الطالب ده؟')) return;
  const { error } = await sb.from('students').delete().eq('id', id);
  if (error) return showToast('خطأ: ' + error.message, 'error');
  showToast('تم الحذف', 'info');
  await renderView('students');
};

window.showQR = (token, name) => {
  document.getElementById('qrStudentName').textContent = `QR – ${name}`;
  const c = document.getElementById('qrCodeCanvas');
  c.innerHTML = '';
  const url = `${location.origin}${location.pathname}?qr=${token}`;
  new QRCode(c, { text: url, width: 180, height: 180 });
  openModal('qrDisplayModal');
};

    return (sessions.reduce((a,ses)=>a+(ses[key]||0),0)/sessions.length).toFixed(1);

        ${lv ? `<span class="badge badge-blue">${lv.name}</span>` : ''} &nbsp;
        عمر: ${s.age||'؟'} &nbsp; | &nbsp; ${s.parent_phone||'لا يوجد هاتف'}
      </div>
      <div style="margin-top:.5rem; font-size:1.1rem;">${(s.badges||[]).join(' ')}</div>
    </div>
    <div style="text-align:center;">
      <div style="font-size:2rem; font-weight:900; color:var(--accent);">${s.points||0}</div>
      <div style="font-size:.75rem; color:var(--text2);">نقطة</div>
    </div>
  </div>

  <div class="grid grid-4" style="margin-bottom:1rem;">
    <div class="stat-card blue"><div class="stat-icon">📋</div><div class="stat-num">${totalSessions}</div><div class="stat-lbl">حصص مسجلة</div></div>
    <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-num">${presentDays}</div><div class="stat-lbl">أيام حضور</div></div>

      ${[['Logic','logic_score','#00d4ff'],['Coding','coding_score','#7c3aed'],['Creativity','creativity_score','#10b981'],['الفهم','understanding','#f59e0b'],['التطبيق','application','#ef4444'],['السلوك','behavior','#06b6d4']].map(([lbl,key,clr])=>`

  card.innerHTML = `<div class="card-title"><i class="fas fa-robot" style="color:var(--accent);"></i> AI – جاري التحليل... <i class="fas fa-spinner fa-spin"></i></div>`;
  const avg = (key) => sessions?.length ? (sessions.reduce((a,ses)=>a+(ses[key]||0),0)/sessions.length).toFixed(1) : '0';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({

النقاط: ${s.points || 0}
اكتب: (1) نقاط القوة (2) نقاط الضعف (3) توصية عملية واحدة` }]
      })
    });
    const d = await res.json();
    const txt = d.content?.[0]?.text || 'لم أتمكن من التحليل حالياً.';
    card.innerHTML = `
      <div class="card-title"><i class="fas fa-robot" style="color:var(--accent);"></i> AI – تحليل ذكي

window.openSessionModal = (studentId, studentName) => {
  document.getElementById('sessStudentId').value = studentId;
  document.getElementById('sessionStudentName').textContent = `تقييم حصة – ${studentName}`;
  document.getElementById('sessDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('sessNotes').value = '';
  sessionRatings = { understanding:0, application:0, behavior:0, logic_score:0, coding_score:0, creativity_score:0 };
  ['understanding','application','behavior','logic_score','coding_score','creativity_score'].forEach(buildStars);
  openModal('sessionModal');
};

function buildStars(key) {
  const el = document.getElementById(`stars-${key}`);
  if (!el) return;
  el.innerHTML = [1,2,3,4,5].map(v =>
    `<span class="star off" data-key="${key}" data-val="${v}" onclick="rateSession('${key}',${v})">★</span>`
  ).join('');
}
window.rateSession = (key, val) => {
  sessionRatings[key] = val;
  document.querySelectorAll(`.star[data-key="${key}"]`).forEach(s => {
    s.classList.toggle('on',  parseInt(s.dataset.val) <= val);
    s.classList.toggle('off', parseInt(s.dataset.val) >  val);
  });
};

window.saveSession = async () => {
  const studentId = document.getElementById('sessStudentId').value;
  const sessDate  = document.getElementById('sessDate').value;
  const notes     = document.getElementById('sessNotes').value.trim();
  if (!sessDate) return showToast('حدد تاريخ الحصة!', 'error');
  const payload = { student_id: parseInt(studentId), session_date: sessDate, coach_notes: notes, ...sessionRatings };
  const { error } = await sb.from('sessions').insert([payload]);
  if (error) return showToast('خطأ: ' + error.message, 'error');
  // إضافة نقاط
  const totalScore = Object.values(sessionRatings).reduce((a,b)=>a+b,0);
  const pts = Math.round(totalScore * 4);
  await sb.from('students').update({ points: (appData.students.find(x=>x.id==studentId)?.points||0) + pts }).eq('id', studentId);
  closeModal('sessionModal');
  showToast(`تم حفظ التقييم! +${pts} نقطة ✅`, 'success');
  await renderView('students');
};

// ==================== PDF EXPORT ====================
window.exportStudentPDF = async (studentId) => {
  const s = appData.students.find(x=>x.id===studentId);
  if (!s) return;
  const { data: sessions } = await sb.from('sessions').select('*').eq('student_id', studentId).order('session_date');
  const avg = (key) => sessions?.length ? (sessions.reduce((a,ses)=>a+(ses[key]||0),0)/sessions.length).toFixed(1) : '0';
  const lv = appData.levels.find(l=>l.id===s.level_id);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'p', unit:'mm', format:'a4' });
  doc.setFont('helvetica');
  // Header
  doc.setFillColor(0,212,255); doc.rect(0,0,210,35,'F');
  doc.setTextColor(0,0,0); doc.setFontSize(22); doc.setFont('helvetica','bold');
  doc.text('Technova Academy', 20, 18);
  doc.setFontSize(12); doc.text('Student Progress Report', 20, 28);
  // Student info
  doc.setTextColor(0,0,0); doc.setFillColor(240,248,255); doc.roundedRect(10,40,190,40,4,4,'F');
  doc.setFontSize(16); doc.text(s.name, 105, 52, {align:'center'});
  doc.setFontSize(10);
  doc.text(`Age: ${s.age||'?'} | Level: ${lv?.name||'N/A'} | Points: ${s.points||0}`, 105, 60, {align:'center'});
  doc.text(`Badges: ${(s.badges||[]).join(' ')||'None'} | Notes: ${s.notes||'N/A'}`, 105, 68, {align:'center'});
  // Skills
  doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text('Skills Average', 20, 90);
  const skills = [['Logic',avg('logic_score')],['Coding',avg('coding_score')],['Creativity',avg('creativity_score')],['Understanding',avg('understanding')],['Application',avg('application')],['Behavior',avg('behavior')]];
  skills.forEach(([lbl,val],i) => {
    const x = i%2===0?20:110; const y = 98 + Math.floor(i/2)*12;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(`${lbl}: ${val}/5`, x, y);
    doc.setFillColor(0,212,255,80); doc.roundedRect(x+40,y-5,parseFloat(val)*10,6,2,2,'F');
  });
  // Sessions
  if (sessions?.length) {
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Session History', 20, 140);
    sessions.slice(0,8).forEach((ses,i) => {
      const y = 148 + i*9;
      if (y > 270) return;
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text(`${ses.session_date} | L:${ses.logic_score} C:${ses.coding_score} Cr:${ses.creativity_score} | ${ses.coach_notes||''}`, 20, y);
    });
  }
  // Footer
  doc.setFillColor(30,41,59); doc.rect(0,280,210,17,'F');
  doc.setTextColor(148,163,184); doc.setFontSize(8);
  doc.text(`Generated by Technova Academy – ${new Date().toLocaleDateString('ar-EG')}`, 105, 290, {align:'center'});
  doc.save(`${s.name}_report.pdf`);
  showToast(`تم تحميل تقرير ${s.name} ✅`, 'success');
};

  const token = document.getElementById('qrTokenInput').value.trim();
  if (!token) return showToast('أدخل الرمز!', 'error');
  const { data } = await sb.from('students').select('*').eq('qr_token', token).single();
  if (!data) return showToast('رمز غير صحيح', 'error');
  closeModal('qrModal');
  showToast(`أهلاً! هذا هو ملف ${data.name}`, 'info');
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'flex';
  await refreshData();
  showProfile(data.id);
};

// ==================== THEME ====================
window.toggleTheme = () => document.body.classList.toggle('light');

// ==================== EVENTS ====================
document.querySelectorAll('.nav-item[data-view]').forEach(btn =>
  btn.addEventListener('click', () => renderView(btn.dataset.view))
);

// ==================== AUTO LOGIN ====================
window.addEventListener('load', async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if (session) await bootApp(session.user);
  // QR token في URL
  const params = new URLSearchParams(location.search);
  const qrToken = params.get('qr');
  if (qrToken) {
    const { data } = await sb.from('students').select('*').eq('qr_token', qrToken).single();
    if (data) { document.getElementById('authScreen').style.display='none'; document.getElementById('appWrap').style.display='flex'; await refreshData(); showProfile(data.id); }
  }
});
</script>

</body>
</html>
